requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.22.0",
    "imageio-ffmpeg>=0.5.1",
    "librosa>=0.10.1",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.1.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "soundfile>=0.12.1",
    "sqlalchemy>=2.0.28",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "torchvision>=0.17.0",
    "uvicorn[standard]>=0.28.0",
